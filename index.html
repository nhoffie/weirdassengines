let ph=0,playing=true,last=performance.now();
showEngine('four');
const rpm=document.getElementById('rpm');
rpm.oninput=()=>rv.textContent=rpm.value;
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};
function frame(t){
 const dt=(t-last)/1000;last=t;
 if(playing)ph=(ph+dt*rpm.value*Math.PI/30)%E.period;
 if(playing||dirty){dirty=false;const l=E.shapes(ph);views.forEach(v=>{if(v.vis!==false)draw(v,l)})}
 ang.textContent=E.read(ph);
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
